# D-06 entry point for ops workstream. The actual ops job runs in main-ci.yml
# under the `ops` job (conditional on `detect-changes.outputs.ops == 'true'`).
# This file exists for clarity (ops ws contributors look here first) and as the
# documentation anchor referenced from docs/mcpgen-gsd-sprint-plan.md §3.
#
# Per docs/decisions/002-single-ci-workflow-with-paths-filter.md, all real work runs
# in main-ci.yml; this entry point only emits a marker.
name: Ops CI (entrypoint — see main-ci.yml `ops` job)
on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'infrastructure/**'

jobs:
  ops-marker:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Ops ws CI runs in main-ci.yml under the 'ops' job; this entry point exists per D-06."

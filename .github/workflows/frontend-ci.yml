# D-06 entry point for frontend workstream. The actual frontend job runs in main-ci.yml
# under the `frontend` job (conditional on `detect-changes.outputs.frontend == 'true'`).
# This file exists for clarity (frontend ws contributors look here first) and as the
# documentation anchor referenced from docs/mcpgen-gsd-sprint-plan.md §3.
#
# Per docs/decisions/002-single-ci-workflow-with-paths-filter.md, all real work runs
# in main-ci.yml; this entry point only emits a marker.
name: Frontend CI (entrypoint — see main-ci.yml `frontend` job)
on:
  pull_request:
    paths: ['apps/web/**']

jobs:
  frontend-marker:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Frontend ws CI runs in main-ci.yml under the 'frontend' job; this entry point exists per D-06."

name: web / mock audit
on:
  pull_request:
    paths: ['apps/web/src/**']
  push:
    branches: [main]
    paths: ['apps/web/src/**']
jobs:
  audit-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: node apps/web/scripts/audit-mock.mjs

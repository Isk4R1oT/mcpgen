[project]
name = "mcpgen-generation-engine"
version = "0.0.0"
description = "MCPGen LLM orchestration engine — 6 LLM passes + 3 deterministic stages."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-ai>=0.0.40",
  "pydantic-settings>=2.5,<3.0",
  "httpx>=0.27,<1.0",
  "tenacity>=9.0,<10.0",
  "structlog>=24.4,<25.0",
  "sentry-sdk[fastapi]>=2.16,<3.0",
  "logfire>=1.0,<2.0",
  "opentelemetry-sdk>=1.27,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2.0",
  "prance[osv]>=23.6.21",
  "openapi-spec-validator>=0.7,<1.0",
  "jsonschema>=4.26,<5.0",
  "jinja2>=3.1,<4.0",
  "psycopg[binary,pool]>=3.2,<4.0",
  "aioboto3>=13.2,<14.0",
  "mcpgen-ir",
  "python-ulid>=3.1.0",
  "tiktoken>=0.7,<1",
  "jsonschema>=4.26,<5",
  # Phase 5 — F3 test-agent path (Override doc §7.3 documented exception).
  # Pinned per RESEARCH.md §6.10 — patch + minor bumps allowed within 0.x;
  # major bumps are breaking and must go through a docs/decisions/ entry.
  "anthropic>=0.96.0,<1.0",
  # Phase 5 — F2 σ discrimination metric (np.std with ddof=0 per RESEARCH §6.5).
  "numpy>=2.0,<3.0",
]

[dependency-groups]
dev = [
  "ruff>=0.7,<1.0",
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-httpx>=0.32,<1.0",
  "datamodel-code-generator>=0.26.4,<1.0",
  "ipython>=8.28",
]

[tool.uv.sources]
mcpgen-ir = { path = "../../packages/ir", editable = true }

# ─── Source maps upload (CTRL-08 / D-05) ──────────────────────────────────────
# Phase 9 wires the orchestrator command (scripts/sourcemaps/upload-all.sh) but
# leaves apps/generation-engine deferred to Phase 10: local Python runs from
# source so there is no PyInstaller bundle to map. Phase 10 invocation:
#   sentry-cli sourcemaps upload --release "$VERSION" --upload-source dist/
# SENTRY_AUTH_TOKEN is provisioned by CI in Phase 10 — see .env.example for the
# CI-only env contract (NEVER add SENTRY_AUTH_TOKEN to .env.local).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpgen_engine"]

# ─── Ruff ─────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# CLAUDE.md global rules: no Any (handled by mypy), strict typing, imports at top, no default params
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "RUF",
  "ANN",
  "SIM",
  "PT",
  "S",
  "ASYNC",
  "TRY",
  "RET",
  "ARG",
  "RSE",
]
ignore = [
  "S101",   # asserts in tests are fine
  "ANN101", # deprecated rule (ruff >=0.5); pre-commit older ruff still emits — global ignore
  "ANN401", # `Any` already forbidden via mypy strict; this rule duplicates
  "TRY003", # long error messages are fine for engine
]

[tool.ruff.lint.per-file-ignores]
# S106 misfires on `pass_name="pass_0"` / `pass_version="1"` kwargs (pass-* token).
# SLF001 is OK in tests that need to inspect on-disk cache layout via `_path_for`.
"tests/**/*.py" = ["S101", "S105", "ANN201", "ANN001", "S106", "SLF001"]
# Module-level *_PROMPT constants are LLM system prompts, not credentials.
# S105 (hardcoded password) misfires on the "PASS"/"PROMPT" name prefix.
"src/mcpgen_engine/passes/**/prompts.py" = ["S105"]
"src/mcpgen_engine/passes/**/quality_gate.py" = ["S105"]
"src/mcpgen_engine/passes/**/__init__.py" = ["S105"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── mypy ─────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = [
  "prance.*",
  "openapi_spec_validator.*",
  "tenacity.*",
  "logfire.*",
  "aioboto3.*",
  "yaml",
  "mcpgen_ir.*",
  "jsonschema.*",
]
ignore_missing_imports = true

# ─── pytest ────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "requires_openrouter: tests that need OPENROUTER_API_KEY (Day-1 smoke test)",
  "requires_node_modules: tests that need packages/codegen-templates/node_modules (wrangler binary)",
  "slow: tests that take > 5s",
  "requires_anthropic: integration tests that call Anthropic API (skipped when ANTHROPIC_API_KEY unset or sk-ant-test-PLACEHOLDER)",
  "requires_wrangler: integration tests that spawn `wrangler dev --local` subprocess (skipped when wrangler missing on PATH)",
]
addopts = [
  "-q",
  "--strict-markers",
  "--strict-config",
]
filterwarnings = [
  "error",
  # Upstream pydantic-ai 0.2.x imports `opentelemetry._events.*` which the
  # opentelemetry-sdk 1.39+ now deprecates in favour of stable `Logger`/
  # `LoggerProvider`/`ProxyLoggerProvider`/`NoOpLogger` APIs. The deprecation
  # is raised through `typing_extensions.{__init_subclass__,__new__}` so the
  # message-level pattern below is the only one that catches it consistently.
  # Out of our scope - bumps with the next pydantic-ai release. See
  # pydantic-ai #1815.
  "ignore:You should use `.*` instead\\. Deprecated since version 1\\.39\\.0.*:DeprecationWarning",
]
